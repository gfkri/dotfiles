set-option -g status-position top
set-option -g status-interval 1
set-option -g status-style fg=red,bg=colour235
set-option -g status-left-length 20
set-option -g status-left-style default
set-option -g status-left "#[fg=green, bright]#H   "
set-option -g status-right-length 140
set-option -g status-right-style default
set-option -g status-right " #[fg=white,bg=default]%a%l:%M:%S %p#[default] #[fg=blue]%Y-%m-%d"
set-window-option -g window-status-style fg=colour244
set-window-option -g window-status-style bg=default
set-window-option -g window-status-current-style fg=colour166
set-window-option -g window-status-current-style bg=default

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
if-shell "uname | grep -q Darwin" {
    set -s copy-command 'pbcopy'
    bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
} {
    set -s copy-command 'xclip -selection clipboard'
    bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard'
}

set -g default-terminal "tmux-256color"
set -ga update-environment "TERM_PROGRAM"
set -ga update-environment "COLORTERM"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

set -g mouse on
set-option -g history-limit 10000

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind Space last-window

# bin prefix+r to reload the config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'
if-shell "command -v nvidia-smi" \
    "set -g @dracula-plugins 'cpu-usage gpu-usage ram-usage'" \
    "set -g @dracula-plugins 'cpu-usage ram-usage'"

# Last saved environment is automatically restored when tmux is started.
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'